name: HealthTrack CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydantic-settings

      - name: Verify imports
        run: |
          PYTHONPATH=. python -c "from app.db.base import Base; print('Base loaded successfully')"

      - name: Run Black check
        run: |
          black --check .

      - name: Run Ruff
        run: |
          ruff check .
